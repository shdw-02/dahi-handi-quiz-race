<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I&E Quiz Arena — Multi-Round & Matki Finale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cinzel:wght@600;700&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-top:#070a20;
    --night-mid:#150b34;
    --royal-purple:#331a5c;
    --peacock-deep:#07231f;
    --peacock-mid:#0f4a44;
    --peacock-light:#166a5f;
    --indigo:#1b1240;
    --gold:#f0b429;
    --gold-soft:#f7d685;
    --saffron:#ff9a3c;
    --terracotta:#b5651d;
    --terracotta-dark:#8a4b16;
    --cream:#f8f1de;
    --rose:#c1447e;
    --success:#49b788;
    --danger:#d1495b;
    --sky:#5a8dee;
    --moon:#fff6e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 4%, rgba(255,246,224,0.09) 0%, transparent 16%),
      radial-gradient(circle at 80% 6%, rgba(255,246,224,0.08) 0%, transparent 9%),
      radial-gradient(circle at 12% 10%, rgba(240,180,41,0.10), transparent 42%),
      radial-gradient(circle at 88% 30%, rgba(51,26,92,0.55), transparent 45%),
      radial-gradient(circle at 10% 92%, rgba(193,68,126,0.12), transparent 45%),
      linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 26%, var(--royal-purple) 46%, var(--peacock-deep) 74%, var(--peacock-mid) 100%);
    color:var(--cream);
    font-family:'Mukta',sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px;position:relative;z-index:2;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--gold-soft);
    opacity:.85;
  }

  .nav-tabs{display:flex;gap:10px;margin:18px 0;border-bottom:1.5px solid rgba(255,255,255,0.12);padding-bottom:12px;}
  .nav-tab{padding:8px 18px;border-radius:10px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;cursor:pointer;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);color:var(--cream);transition:all .15s ease;}
  .nav-tab.active{background:var(--gold);color:#2a1c00;border-color:var(--gold);}

  #bgDecor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .star{position:absolute;width:2.4px;height:2.4px;border-radius:50%;background:#fff6e0;animation:twinkle 3.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:1;transform:scale(1.6);}}
  .moon{position:absolute;top:26px;right:9%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #fffdf3, var(--moon) 60%, #e9d9a8 100%);box-shadow:0 0 40px 10px rgba(255,246,224,.25);opacity:.9;}
  .firefly{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold-soft);box-shadow:0 0 6px 2px rgba(247,214,133,.75);animation:fireflyDrift linear infinite;}
  @keyframes fireflyDrift{0%{transform:translate(0,0);opacity:0;}10%{opacity:.9;}50%{transform:translate(24px,-34px);opacity:.5;}90%{opacity:.85;}100%{transform:translate(-14px,-70px);opacity:0;}}

  .feather-divider{height:14px;margin:14px 0 26px;position:relative;z-index:2;background-repeat:repeat-x;background-size:34px 14px;opacity:.55;background-image:radial-gradient(circle at 50% 30%, var(--rose) 0 3px, transparent 4px), radial-gradient(circle at 50% 0, transparent 0 0);mask-image:linear-gradient(90deg, transparent, black 8%, black 92%, transparent);}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 4px 8px;flex-wrap:wrap;position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand svg{width:46px;height:46px;flex-shrink:0;}
  .brand-text .name{font-family:'Cinzel',serif;font-size:19px;font-weight:700;letter-spacing:.04em;color:var(--cream);}
  .brand-text .tag{font-size:11.5px;color:var(--gold-soft);font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}

  .hero{text-align:center;padding:18px 10px 8px;position:relative;}
  .hero.small{padding-top:6px;}
  .hero h2{font-family:'Cinzel',serif;font-size:clamp(26px,4.4vw,44px);color:var(--cream);line-height:1.2;position:relative;font-weight:700;}
  .hero h2 span{color:var(--gold);}
  .hero p{max-width:620px;margin:14px auto 0;color:var(--cream);opacity:.8;font-size:15.5px;line-height:1.6;position:relative;}

  .role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:38px;max-width:760px;margin-left:auto;margin-right:auto;}
  .role-card{position:relative;border-radius:22px;padding:30px 20px;text-align:center;text-decoration:none;color:var(--cream);background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));border:1.5px solid rgba(255,255,255,0.10);transition:transform .18s ease, border-color .18s ease;overflow:hidden;}
  .role-card:hover{transform:translateY(-5px);border-color:var(--gold-soft);}
  .role-icon{font-size:36px;margin-bottom:10px;}
  .role-title{font-family:'Cinzel',serif;font-weight:700;font-size:20px;letter-spacing:.03em;color:var(--gold-soft);}
  .role-sub{font-size:13px;opacity:.72;margin-top:8px;line-height:1.55;}

  .panel{background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:18px 20px;margin-top:18px;position:relative;z-index:2;}
  .panel h3{font-size:15px;color:var(--gold-soft);letter-spacing:.03em;margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;color:#fff;border:none;border-radius:11px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s ease;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#d99a1f);color:#2a1c00;}
  .btn.green{background:linear-gradient(135deg,var(--success),#2f9c6f);}
  .btn.red{background:linear-gradient(135deg,var(--danger),#a83346);}
  .btn.sky{background:linear-gradient(135deg,var(--sky),#3f6fd6);}
  .btn.ghost{background:rgba(255,255,255,0.08);box-shadow:none;border:1px solid rgba(255,255,255,0.16);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}

  .code-input, .access-input{display:block;width:min(240px,100%);margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.3em;text-align:center;padding:10px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.18);color:var(--gold-soft);}
  .name-input{display:block;width:100%;max-width:340px;margin-top:8px;font-family:'Mukta',sans-serif;font-size:15px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.18);color:var(--cream);}
  .form-error{margin-top:12px;color:#ff9aa6;font-size:13px;font-family:'JetBrains Mono',monospace;}

  .timer-big{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:12px auto;font-family:'JetBrains Mono',monospace;}
  .timer-big .timer-num{font-size:46px;font-weight:800;color:var(--gold);text-shadow:0 0 16px rgba(240,180,41,.4);min-width:1.4em;text-align:center;}
  .timer-big .timer-lbl{font-size:13px;opacity:.6;letter-spacing:.08em;text-transform:uppercase;}
  .timer-big.urgent .timer-num{color:var(--danger);animation:timerPulse .6s ease-in-out infinite;}
  .timer-big.expired .timer-num{color:var(--danger);}
  @keyframes timerPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}

  .buzz-btn{width:min(260px,70vw);height:min(260px,70vw);border-radius:50%;border:none;cursor:pointer;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32px;color:#fff;margin:18px auto 10px;display:block;box-shadow:0 10px 0 rgba(0,0,0,.28), 0 18px 34px rgba(0,0,0,.35);transition:transform .08s ease;letter-spacing:.02em;}
  .buzz-btn:active{transform:translateY(8px);box-shadow:0 2px 0 rgba(0,0,0,.28);}
  .buzz-btn:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed;}

  .score-badge{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(240,180,41,0.16);border:1.5px solid var(--gold);color:var(--gold-soft);font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;}
  .q-display{font-family:'Cinzel',serif;font-size:clamp(32px,5vw,52px);font-weight:700;color:var(--gold);text-align:center;margin:8px 0;}
  
  .table-box{width:100%;border-collapse:collapse;margin-top:12px;}
  .table-box th, .table-box td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.08);font-size:14px;}
  .table-box th{font-family:'JetBrains Mono',monospace;color:var(--gold-soft);font-size:12px;text-transform:uppercase;}
  
  .queue-card{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);margin-bottom:8px;}
  .queue-card.active-turn{border-color:var(--gold);background:rgba(240,180,41,0.15);}
  
  .race-board{display:grid;gap:8px;background:rgba(0,0,0,0.18);border-radius:20px;padding:18px 10px 8px;border:1px solid rgba(255,255,255,0.07);margin-top:18px;}
  .pole-col{display:flex;flex-direction:column;align-items:center;}
  .pole-name{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;text-align:center;margin-top:2px;}
  .pole-steps{font-family:'JetBrains Mono',monospace;font-size:12px;opacity:.7;}
</style>
</head>
<body>

<div id="bgDecor">
  <div class="moon"></div>
  <div id="fireflyLayer"></div>
</div>

<div class="wrap" id="app"></div>

<script>
/* ============================= CONFIG & AUDIO ============================= */
const COLOR_PALETTE = ['#f0b429','#c1447e','#49b788','#5a8dee','#e8734a','#9b6bd9','#2fb4c7','#d9527a'];
const STATE_KEY = 'quiz_arena_unified_state';
const POLL_MS = 600;
const BUZZ_TIME_LIMIT = 45; // 45 seconds timer triggered on buzz

let actx = null;
function getCtx(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) actx = new AC();
  }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(ctx, freq, start, dur, type='sine', peak=0.2){
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime+start);
  gain.gain.exponentialRampToValueAtTime(peak, ctx.currentTime+start+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime+start);
  osc.stop(ctx.currentTime+start+dur+0.05);
}
function playBuzz(){ const c=getCtx(); tone(c, 680, 0, 0.08, 'square', 0.15); tone(c, 440, 0.06, 0.08, 'square', 0.12); }
function playCorrect(){ const c=getCtx(); tone(c, 523, 0, 0.12, 'triangle', 0.18); tone(c, 659, 0.1, 0.15, 'triangle', 0.18); tone(c, 783, 0.2, 0.25, 'triangle', 0.2); }
function playWrong(){ const c=getCtx(); tone(c, 240, 0, 0.18, 'sawtooth', 0.15); tone(c, 180, 0.15, 0.25, 'sawtooth', 0.18); }

/* ============================= STATE STORE ============================= */
function defaultState(){
  return {
    mode: 'room',
    roomPasskey: '1234',
    accessCode: 'JANMASHTAMI',
    
    // --- Room / Rounds Setup ---
    rounds: [
      { name: 'Round 1: Elimination', questionsCount: 15, basePoints: 5 },
      { name: 'Round 2: Semi-Finals', questionsCount: 5, basePoints: 2 }
    ],
    activeRoundIndex: 0,
    activeQuestionNum: 1,
    questionActive: false,
    
    // Buzzer state for Room
    roomBuzzerQueue: [], // [{ contestantId, name, ts }]
    roomCurrentTurn: 0,
    roomAttempts: 0,
    turnEndsAt: null, // ms timestamp: active turn ends at
    contestants: {},
    
    // --- Matki Finale State ---
    teams: [],
    lobbyOpen: false,
    matkiRoomCode: '5555',
    steps: {},
    totalSteps: 6,
    matkiWinner: null
  };
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  }catch(e){
    return defaultState();
  }
}
async function saveState(s){
  localStorage.setItem(STATE_KEY, JSON.stringify(s));
  return s;
}

function calcCurrentPoints(state){
  const r = state.rounds[state.activeRoundIndex];
  if(!r) return 1;
  const pts = r.basePoints - (state.roomAttempts || 0);
  return Math.max(1, pts);
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= TIMER HELPERS ============================= */
let liveStateCache = null;
function updateTimerElement(el, state){
  if(!el) return;
  const numEl = el.querySelector('.timer-num');
  if(!numEl) return;
  
  if(!state || !state.questionActive || !state.turnEndsAt || state.roomBuzzerQueue.length === 0){
    numEl.textContent = '--';
    el.classList.remove('urgent', 'expired');
    return;
  }
  const remain = (state.turnEndsAt - Date.now()) / 1000;
  const expired = remain <= 0;
  numEl.textContent = expired ? '0' : Math.max(0, Math.ceil(remain));
  el.classList.toggle('urgent', !expired && remain <= 10);
  el.classList.toggle('expired', expired);
}

setInterval(()=>{
  if(liveStateCache){
    document.querySelectorAll('.timer-big').forEach(el=>updateTimerElement(el, liveStateCache));
  }
}, 250);

/* ============================= ROUTING & BASE ============================= */
const params = new URLSearchParams(location.search);
const role = params.get('role');
const app = document.getElementById('app');

(function initAmbient(){
  const fLayer = document.getElementById('fireflyLayer');
  for(let i=0;i<12;i++){
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = (5+Math.random()*90)+'vw';
    f.style.top = (20+Math.random()*70)+'vh';
    f.style.animationDuration = (4+Math.random()*4)+'s';
    fLayer.appendChild(f);
  }
})();

function brandSvg(){
  return `<svg viewBox="0 0 60 60" fill="none"><circle cx="30" cy="30" r="26" stroke="#f0b429" stroke-width="2"/><path d="M30 12 L30 48 M12 30 L48 30" stroke="#f7d685" stroke-width="2"/><circle cx="30" cy="30" r="8" fill="#f0b429"/></svg>`;
}

/* ============================= LANDING ============================= */
function renderLanding(){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">${brandSvg()}<div class="brand-text"><div class="name">I&amp;E CELL</div><div class="tag">Quiz Arena Platform</div></div></div>
    </div>
    <div class="feather-divider"></div>
    <div class="hero">
      <div class="eyebrow">Interactive Event Arena</div>
      <h2>Select Your <span>Portal</span></h2>
      <p>Multi-round sequential buzzer rooms with 45s turn timer on buzz, plus the Matki Finale.</p>
    </div>
    <div class="role-grid">
      <a class="role-card" href="?role=host">
        <div class="role-icon">🖥️</div>
        <div class="role-title">Host Panel</div>
        <div class="role-sub">Configure rounds, control questions, assign marks, view contestant buzzer queues & rankings.</div>
      </a>
      <a class="role-card" href="?role=contestant">
        <div class="role-icon">🙋</div>
        <div class="role-title">Contestant Entry</div>
        <div class="role-sub">Join standard Buzzer Room directly via passkey or join the Finale Matki Lobby.</div>
      </a>
    </div>
  `;
}

/* ============================= HOST VIEW ============================= */
let hostActiveTab = 'room';

function renderHostShell(state){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">${brandSvg()}<div class="brand-text"><div class="name">I&amp;E CELL</div><div class="tag">Host Control Panel</div></div></div>
      <a href="?" class="btn ghost">← Home</a>
    </div>
    <div class="feather-divider"></div>

    <div class="nav-tabs">
      <button class="nav-tab ${hostActiveTab==='room'?'active':''}" id="tabRoom">🎯 Active Room Control</button>
      <button class="nav-tab ${hostActiveTab==='rounds_config'?'active':''}" id="tabConfig">⚙️ Round Setup</button>
      <button class="nav-tab ${hostActiveTab==='leaderboard'?'active':''}" id="tabLeaderboard">🏆 Leaderboard & Ranks</button>
      <button class="nav-tab ${hostActiveTab==='matki'?'active':''}" id="tabMatki">🧈 Matki Lobby (Finale)</button>
    </div>

    <div id="hostContent"></div>
  `;

  document.getElementById('tabRoom').addEventListener('click', ()=>{ hostActiveTab='room'; renderHostSubView(state); });
  document.getElementById('tabConfig').addEventListener('click', ()=>{ hostActiveTab='rounds_config'; renderHostSubView(state); });
  document.getElementById('tabLeaderboard').addEventListener('click', ()=>{ hostActiveTab='leaderboard'; renderHostSubView(state); });
  document.getElementById('tabMatki').addEventListener('click', ()=>{ hostActiveTab='matki'; renderHostSubView(state); });

  renderHostSubView(state);
}

function renderHostSubView(state){
  const container = document.getElementById('hostContent');
  if(hostActiveTab === 'room') renderHostRoomTab(container, state);
  else if(hostActiveTab === 'rounds_config') renderHostConfigTab(container, state);
  else if(hostActiveTab === 'leaderboard') renderHostLeaderboardTab(container, state);
  else if(hostActiveTab === 'matki') renderHostMatkiTab(container, state);
}

function renderHostRoomTab(container, state){
  liveStateCache = state;
  const curRound = state.rounds[state.activeRoundIndex] || { name: 'None', questionsCount: 0, basePoints: 0 };
  const curPts = calcCurrentPoints(state);
  const queue = state.roomBuzzerQueue || [];
  const curBuzzer = queue[state.roomCurrentTurn];

  container.innerHTML = `
    <div class="panel">
      <div class="row" style="justify-content:space-between;">
        <div>
          <span class="eyebrow">Current Round:</span>
          <h2 style="color:var(--gold-soft);">${escapeHtml(curRound.name)}</h2>
          <div style="font-family:'JetBrains Mono';font-size:13px;opacity:.7;">Room Passkey: <b>${escapeHtml(state.roomPasskey)}</b></div>
        </div>
        <div style="text-align:right;">
          <span class="eyebrow">Current Value:</span>
          <div class="score-badge">${curPts} Points</div>
        </div>
      </div>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="eyebrow">Display Screen</div>
      <div class="q-display">${state.questionActive ? `Q. ${state.activeQuestionNum}` : 'Question Inactive'}</div>
      
      <div class="timer-big" id="hostTimerDisplay">
        <span class="timer-num">--</span>
        <span class="timer-lbl">sec left</span>
      </div>

      <div class="row" style="justify-content:center;margin-top:12px;">
        <button class="btn gold" id="btnNextQ">Next Question →</button>
        <button class="btn sky" id="btnToggleQ">${state.questionActive ? 'Pause Buzzer' : 'Open Buzzer'}</button>
        <button class="btn ghost" id="btnClearBuzz">Reset Buzzer</button>
      </div>
    </div>

    <div class="panel">
      <h3>Host Buzzer Order List (Private to Host)</h3>
      <div id="hostQueueWrap">
        ${queue.length === 0 ? `<div style="opacity:.6;font-size:13px;">No buzzes yet. Timer will start for 45s when 1st contestant buzzes.</div>` : 
          queue.map((b, i)=>{
            const isTurn = i === state.roomCurrentTurn;
            const isDone = i < state.roomCurrentTurn;
            return `
              <div class="queue-card ${isTurn?'active-turn':''}">
                <div>
                  <b>#${i+1}</b> &nbsp; ${escapeHtml(b.name)}
                  ${isTurn ? `<span style="color:var(--gold);font-weight:700;"> (Answering Now · 45s · ${curPts} pts)</span>` : ''}
                  ${isDone ? `<span style="opacity:.5;"> (Wrong Answer)</span>` : ''}
                </div>
                <div>
                  ${isTurn ? `
                    <button class="btn green" id="btnCorrect" style="padding:6px 12px;font-size:12px;">✓ Correct (+${curPts})</button>
                    <button class="btn red" id="btnWrong" style="padding:6px 12px;font-size:12px;">✗ Wrong (Reset 45s for #${i+2})</button>
                  ` : ''}
                </div>
              </div>
            `;
          }).join('')}
      </div>
    </div>
  `;

  updateTimerElement(document.getElementById('hostTimerDisplay'), state);

  document.getElementById('btnNextQ').addEventListener('click', async ()=>{
    const s = await loadState();
    s.activeQuestionNum += 1;
    s.questionActive = true;
    s.roomBuzzerQueue = [];
    s.roomCurrentTurn = 0;
    s.roomAttempts = 0;
    s.turnEndsAt = null; // Timer waits until someone buzzes
    await saveState(s);
    renderHostSubView(s);
  });

  document.getElementById('btnToggleQ').addEventListener('click', async ()=>{
    const s = await loadState();
    s.questionActive = !s.questionActive;
    if(!s.questionActive) s.turnEndsAt = null;
    await saveState(s);
    renderHostSubView(s);
  });

  document.getElementById('btnClearBuzz').addEventListener('click', async ()=>{
    const s = await loadState();
    s.roomBuzzerQueue = [];
    s.roomCurrentTurn = 0;
    s.roomAttempts = 0;
    s.turnEndsAt = null;
    await saveState(s);
    renderHostSubView(s);
  });

  if(document.getElementById('btnCorrect')){
    document.getElementById('btnCorrect').addEventListener('click', async ()=>{
      playCorrect();
      const s = await loadState();
      const b = s.roomBuzzerQueue[s.roomCurrentTurn];
      if(b && s.contestants[b.contestantId]){
        const pts = calcCurrentPoints(s);
        const rIdx = s.activeRoundIndex;
        s.contestants[b.contestantId].scores[rIdx] = (s.contestants[b.contestantId].scores[rIdx] || 0) + pts;
        s.contestants[b.contestantId].totalScore = s.contestants[b.contestantId].scores.reduce((a,c)=>a+c, 0);
      }
      s.questionActive = false;
      s.turnEndsAt = null;
      await saveState(s);
      renderHostSubView(s);
    });
  }

  if(document.getElementById('btnWrong')){
    document.getElementById('btnWrong').addEventListener('click', async ()=>{
      playWrong();
      const s = await loadState();
      s.roomCurrentTurn += 1;
      s.roomAttempts += 1; // Mark decays by 1
      
      // If there is already a next person waiting in the buzzer queue, reset timer to 45s for them
      if(s.roomBuzzerQueue[s.roomCurrentTurn]){
        s.turnEndsAt = Date.now() + (BUZZ_TIME_LIMIT * 1000);
      } else {
        s.turnEndsAt = null; // Wait for next contestant to buzz
      }
      
      await saveState(s);
      renderHostSubView(s);
    });
  }
}

function renderHostConfigTab(container, state){

      <h3>1 · Room Security Passkey</h3>
      <input class="access-input" id="cfgPasskey" value="${escapeHtml(state.roomPasskey)}" style="margin:0 0 16px;">

      <h3>2 · Configure Rounds</h3>
      <div id="roundsList">
        ${state.rounds.map((r, idx)=>`
          <div class="panel" style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);margin-bottom:12px;">
            <div class="row">
              <div style="flex:2;">
                <label class="eyebrow">Round ${idx+1} Name</label>
                <input class="name-input" data-idx="${idx}" data-field="name" value="${escapeHtml(r.name)}">
              </div>
              <div style="flex:1;">
                <label class="eyebrow">No. of Questions</label>
                <input type="number" class="name-input" data-idx="${idx}" data-field="questionsCount" value="${r.questionsCount}">
              </div>
              <div style="flex:1;">
                <label class="eyebrow">Starting Points (Grade)</label>
                <input type="number" class="name-input" data-idx="${idx}" data-field="basePoints" value="${r.basePoints}">
              </div>
              <div style="padding-top:20px;">
                <button class="btn ${state.activeRoundIndex===idx?'gold':'ghost'}" data-setactive="${idx}">${state.activeRoundIndex===idx?'Active':'Make Active'}</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="btn sky" id="btnAddRound">+ Add Another Round</button>
        <button class="btn green" id="btnSaveRounds">Save Configuration</button>
      </div>
    </div>
  `;

  document.getElementById('btnAddRound').addEventListener('click', async ()=>{
    const s = await loadState();
    s.rounds.push({ name: `Round ${s.rounds.length+1}`, questionsCount: 10, basePoints: 5 });
    await saveState(s);
    renderHostConfigTab(container, s);
  });

  document.querySelectorAll('[data-setactive]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const s = await loadState();
      s.activeRoundIndex = parseInt(b.dataset.setactive, 10);
      s.activeQuestionNum = 1;
      s.questionActive = false;
      s.roomBuzzerQueue = [];
      s.roomCurrentTurn = 0;
      s.roomAttempts = 0;
      s.turnEndsAt = null;
      await saveState(s);
      renderHostConfigTab(container, s);
    });
  });

  document.getElementById('btnSaveRounds').addEventListener('click', async ()=>{
    const s = await loadState();
    s.roomPasskey = document.getElementById('cfgPasskey').value.trim() || '1234';
    document.querySelectorAll('#roundsList input').forEach(inp=>{
      const idx = parseInt(inp.dataset.idx, 10);
      const f = inp.dataset.field;
      if(f === 'name') s.rounds[idx].name = inp.value.trim();
      else s.rounds[idx][f] = parseInt(inp.value, 10) || 1;
    });
    await saveState(s);
    alert('Configuration saved!');
    renderHostSubView(s);
  });
}

function renderHostLeaderboardTab(container, state){
  const list = Object.values(state.contestants || {});
  list.sort((a,b)=> (b.totalScore||0) - (a.totalScore||0));

  container.innerHTML = `
    <div class="panel">
      <div class="row" style="justify-content:space-between;">
        <h3>Contestant Sequence & Rankings (High to Low)</h3>
        <button class="btn red" id="btnClearScores">Reset Leaderboard</button>
      </div>
      <table class="table-box">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            ${state.rounds.map((r,i)=>`<th>${escapeHtml(r.name)}</th>`).join('')}
            <th>Total Points</th>
          </tr>
        </thead>
        <tbody>
          ${list.length === 0 ? `<tr><td colspan="${3+state.rounds.length}" style="opacity:.6;">No contestants registered yet.</td></tr>` : 
            list.map((c, idx)=>`
              <tr>
                <td><b>#${idx+1}</b></td>
                <td><b>${escapeHtml(c.name)}</b></td>
                ${state.rounds.map((r, i)=>`<td>${c.scores && c.scores[i] ? c.scores[i] : 0}</td>`).join('')}
                <td><span class="score-badge">${c.totalScore||0}</span></td>
              </tr>
            `).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('btnClearScores').addEventListener('click', async ()=>{
    if(confirm('Are you sure you want to reset all contestant points?')){
      const s = await loadState();
      Object.keys(s.contestants).forEach(k=>{
        s.contestants[k].scores = s.rounds.map(()=>0);
        s.contestants[k].totalScore = 0;
      });
      await saveState(s);
      renderHostLeaderboardTab(container, s);
    }
  });
}

      <a href="?" class="btn ghost">← Home</a>

    <div class="feather-divider"></div>

function renderContestantRoomJoin(state, err){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">${brandSvg()}<div class="brand-text"><div class="name">I&amp;E CELL</div><div class="tag">Room Entry</div></div></div>
      <button class="btn ghost" id="btnBackSel">← Back</button>
    </div>
    <div class="feather-divider"></div>
    <div class="hero small">
      <h2>Join <span>Buzzer Room</span></h2>
      <p>Enter the passkey given by the host and your name to join immediately.</p>
    </div>
    <div class="panel" style="max-width:400px;margin:20px auto;">
      <label class="eyebrow">Room Passkey</label>
      <input class="code-input" id="roomPassInput" placeholder="Passkey">
      <label class="eyebrow" style="margin-top:14px;display:block;">Your Name</label>
      <input class="name-input" id="cNameInput" placeholder="e.g. Rahul Verma">
      ${err ? `<div class="form-error">${escapeHtml(err)}</div>` : ''}
      <button class="btn gold" id="btnSubmitRoom" style="margin-top:16px;width:100%;">Join Room</button>
    </div>
  `;

  document.getElementById('btnBackSel').addEventListener('click', ()=>renderContestantLanding(state));
  document.getElementById('btnSubmitRoom').addEventListener('click', async ()=>{
    const pass = document.getElementById('roomPassInput').value.trim();
    const name = document.getElementById('cNameInput').value.trim();
    const s = await loadState();
    if(pass !== s.roomPasskey){
      renderContestantRoomJoin(s, 'Incorrect Room Passkey!');
      return;
    }
    if(!name){
      renderContestantRoomJoin(s, 'Please enter your name!');
      return;
    }
    const id = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    contestantUser = { id, name };
    if(!s.contestants[id]){
      s.contestants[id] = { id, name, scores: s.rounds.map(()=>0), totalScore: 0 };
      await saveState(s);
    }
    startContestantRoomLoop();
  });
}

function renderContestantRoomGame(state){
  liveStateCache = state;
  const user = state.contestants[contestantUser.id] || { name: contestantUser.name, totalScore: 0 };
  const curRound = state.rounds[state.activeRoundIndex] || { name: 'Round' };
  const queue = state.roomBuzzerQueue || [];
  const curBuzzer = queue[state.roomCurrentTurn];
  const curPts = calcCurrentPoints(state);

  const isBuzzedByMe = queue.some(b=>b.contestantId === contestantUser.id);
  const isMyTurn = curBuzzer && curBuzzer.contestantId === contestantUser.id;

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">${brandSvg()}<div class="brand-text"><div class="name">I&amp;E CELL</div><div class="tag">${escapeHtml(curRound.name)}</div></div></div>
      <div>
        <span class="score-badge">My Points: ${user.totalScore||0}</span>
      </div>
    </div>

    <div style="text-align:center;margin-top:10px;">
      <div class="eyebrow">${escapeHtml(user.name)}</div>
      <div class="q-display">${state.questionActive ? `Q. ${state.activeQuestionNum}` : 'Question Paused'}</div>
      
      <div class="timer-big" id="contestantTimerDisplay">
        <span class="timer-num">--</span>
        <span class="timer-lbl">sec left</span>
      </div>

      <div style="font-family:'JetBrains Mono';font-size:14px;color:var(--gold-soft);">Active Value: <b>${curPts} Marks</b></div>
    </div>

    <button class="buzz-btn" id="contestantBuzzBtn" style="background:linear-gradient(160deg, #f0b429, #c1701f);" 
      ${!state.questionActive || isBuzzedByMe ? 'disabled' : ''}>
      ${isMyTurn ? '🎙️ YOUR TURN' : isBuzzedByMe ? 'BUZZED' : 'BUZZ'}
    </button>

    <div style="text-align:center;margin-top:14px;min-height:32px;font-family:'JetBrains Mono';font-size:14px;">
      ${isMyTurn ? `<span style="color:var(--gold);font-weight:700;">Host is listening to your answer! (45s)</span>` :
        curBuzzer ? `<span style="opacity:.8;">${escapeHtml(curBuzzer.name)} is answering...</span>` :
        state.questionActive ? `Buzzer is Open!` : `Waiting for next question...`}
    </div>
  `;

  updateTimerElement(document.getElementById('contestantTimerDisplay'), state);

  const btn = document.getElementById('contestantBuzzBtn');
  if(btn && !btn.disabled){
    btn.addEventListener('click', async ()=>{
      playBuzz();
      const s = await loadState();
      if(!s.questionActive) return;
      if(!s.roomBuzzerQueue.some(b=>b.contestantId === contestantUser.id)){
        const isFirstBuzz = s.roomBuzzerQueue.length === 0;
        s.roomBuzzerQueue.push({ contestantId: contestantUser.id, name: contestantUser.name, ts: Date.now() });
        
        // Start the 45s timer on the 1st buzz
        if(isFirstBuzz || !s.turnEndsAt){
          s.turnEndsAt = Date.now() + (BUZZ_TIME_LIMIT * 1000);
        }
        await saveState(s);
        renderContestantRoomGame(s);
      }
    });
  }
}

function startContestantRoomLoop(){
  setInterval(async ()=>{
    const s = await loadState();
    renderContestantRoomGame(s);
  }, POLL_MS);
}

/* ============================= SVG & POLE HELPERS ============================= */
function renderRaceBoard(state, containerId){
  const el = document.getElementById(containerId);
  if(!el) return;
  const teams = state.teams || [];
  if(teams.length === 0){
    el.style.gridTemplateColumns = '1fr';
    el.innerHTML = `<div style="text-align:center;padding:14px;opacity:.6;">No active teams in Matki lobby.</div>`;
    return;
  }
  el.style.gridTemplateColumns = `repeat(${teams.length}, 1fr)`;
  el.innerHTML = teams.map(t=>`
    <div class="pole-col">
      <div class="pole-name" style="color:${t.color}">${escapeHtml(t.name)}</div>
      <div class="pole-steps">${state.steps[t.id]||0} / ${state.totalSteps}</div>
    </div>
  `).join('');
}

/* ============================= INIT DISPATCHER ============================= */
(async function init(){
  const s = await loadState();
  if(role === 'host'){
    renderHostShell(s);
    setInterval(async ()=>{
      const fresh = await loadState();
      if(hostActiveTab === 'room') renderHostRoomTab(document.getElementById('hostContent'), fresh);
    }, POLL_MS);
  } else if(role === 'contestant'){
    renderContestantLanding(s);
  } else {
    renderLanding();
  }
})();
</script>
