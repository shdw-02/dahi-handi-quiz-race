<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dahi Handi Quiz Race — I&E Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cinzel:wght@600;700&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night-top:#070a20;
    --night-mid:#150b34;
    --royal-purple:#331a5c;
    --peacock-deep:#07231f;
    --peacock-mid:#0f4a44;
    --peacock-light:#166a5f;
    --indigo:#1b1240;
    --gold:#f0b429;
    --gold-soft:#f7d685;
    --saffron:#ff9a3c;
    --terracotta:#b5651d;
    --terracotta-dark:#8a4b16;
    --cream:#f8f1de;
    --rose:#c1447e;
    --success:#49b788;
    --danger:#d1495b;
    --sky:#5a8dee;
    --moon:#fff6e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 4%, rgba(255,246,224,0.09) 0%, transparent 16%),
      radial-gradient(circle at 80% 6%, rgba(255,246,224,0.08) 0%, transparent 9%),
      radial-gradient(circle at 12% 10%, rgba(240,180,41,0.10), transparent 42%),
      radial-gradient(circle at 88% 30%, rgba(51,26,92,0.55), transparent 45%),
      radial-gradient(circle at 10% 92%, rgba(193,68,126,0.12), transparent 45%),
      linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 26%, var(--royal-purple) 46%, var(--peacock-deep) 74%, var(--peacock-mid) 100%);
    color:var(--cream);
    font-family:'Mukta',sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px;position:relative;z-index:2;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--gold-soft);
    opacity:.85;
  }

  /* ---------- Sync warning ---------- */
  .sync-warning{
    position:relative;z-index:5;margin:0 0 16px;padding:11px 16px;border-radius:12px;
    background:rgba(209,73,91,0.14);border:1px solid rgba(209,73,91,0.45);
    color:#ffd9de;font-size:12.5px;line-height:1.55;font-family:'Mukta',sans-serif;
  }

  /* ---------- Background decor ---------- */
  #bgDecor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .star{position:absolute;width:2.4px;height:2.4px;border-radius:50%;background:#fff6e0;
    animation:twinkle 3.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:1;transform:scale(1.6);}}
  .feather-deco{position:absolute;opacity:.10;filter:drop-shadow(0 0 12px rgba(240,180,41,.15));}
  .feather-deco.tr{top:-30px;right:-40px;width:280px;transform:rotate(18deg);}
  .feather-deco.bl{bottom:-50px;left:-60px;width:260px;transform:rotate(-160deg);}
  .diya-row{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:0 4vw;opacity:.55;}
  .diya-row svg{width:34px;height:44px;}
  .flame{animation:flicker 1.6s ease-in-out infinite;transform-origin:50% 90%;}
  .flame:nth-child(odd){animation-duration:1.9s;}
  @keyframes flicker{0%,100%{transform:scaleY(1) scaleX(1);opacity:.95;}30%{transform:scaleY(1.12) scaleX(.92);opacity:1;}55%{transform:scaleY(.9) scaleX(1.05);opacity:.85;}80%{transform:scaleY(1.05) scaleX(.97);opacity:1;}}
  .moon{position:absolute;top:26px;right:9%;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fffdf3, var(--moon) 60%, #e9d9a8 100%);
    box-shadow:0 0 40px 10px rgba(255,246,224,.25);opacity:.9;}

  .krishna-silhouette{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(640px,120vw);opacity:.10;z-index:0;}
  .vrindavan-skyline{position:absolute;bottom:0;left:0;width:100%;opacity:.28;}

  .circuit-overlay{position:absolute;inset:0;width:100%;height:100%;opacity:.16;}
  .circuit-overlay .node{animation:nodePulse 3.4s ease-in-out infinite;}
  .circuit-overlay .node:nth-child(3n){animation-delay:.7s;}
  .circuit-overlay .node:nth-child(3n+1){animation-delay:1.4s;}
  @keyframes nodePulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  .circuit-overlay .wire{stroke-dasharray:5 7;animation:wireFlow 6s linear infinite;}
  @keyframes wireFlow{to{stroke-dashoffset:-120;}}

  .firefly{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold-soft);
    box-shadow:0 0 6px 2px rgba(247,214,133,.75);animation:fireflyDrift linear infinite;}
  @keyframes fireflyDrift{
    0%{transform:translate(0,0);opacity:0;}
    10%{opacity:.9;}
    50%{transform:translate(24px,-34px);opacity:.5;}
    90%{opacity:.85;}
    100%{transform:translate(-14px,-70px);opacity:0;}
  }

  .petal{position:absolute;top:-24px;border-radius:60% 0 60% 0;animation:petalFall linear infinite;}
  @keyframes petalFall{
    0%{transform:translateY(0) rotate(0deg);opacity:0;}
    8%{opacity:.85;}
    92%{opacity:.7;}
    100%{transform:translateY(112vh) rotate(340deg);opacity:0;}
  }

  .rise-particle{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;
    background:radial-gradient(circle, #fffdf3, var(--gold) 70%);
    box-shadow:0 0 8px 2px rgba(240,180,41,.6);animation:riseUp linear infinite;}
  @keyframes riseUp{
    0%{transform:translateY(0) scale(.6);opacity:0;}
    12%{opacity:1;}
    100%{transform:translateY(-92vh) scale(1.1);opacity:0;}
  }

  .hero-motif{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:min(520px,90%);opacity:.16;z-index:0;pointer-events:none;}

  .feather-divider{
    height:14px;margin:14px 0 26px;position:relative;z-index:2;
    background-repeat:repeat-x;background-size:34px 14px;
    opacity:.55;
    background-image:radial-gradient(circle at 50% 30%, var(--rose) 0 3px, transparent 4px),
                      radial-gradient(circle at 50% 0, transparent 0 0);
    mask-image:linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 4px 8px;flex-wrap:wrap;position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand svg{width:46px;height:46px;flex-shrink:0;}
  .brand-text .name{font-family:'Cinzel',serif;font-size:19px;font-weight:700;letter-spacing:.04em;color:var(--cream);}
  .brand-text .tag{font-size:11.5px;color:var(--gold-soft);font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}

  .hero{text-align:center;padding:18px 10px 8px;position:relative;}
  .hero.small{padding-top:6px;}
  .hero h2{font-family:'Cinzel',serif;font-size:clamp(26px,4.4vw,44px);color:var(--cream);line-height:1.2;position:relative;font-weight:700;}
  .hero h2 span{color:var(--gold);}
  .hero p{max-width:620px;margin:14px auto 0;color:var(--cream);opacity:.8;font-size:15.5px;line-height:1.6;position:relative;}

  .matki-hero{position:relative;width:min(230px,54vw);margin:6px auto 0;animation:matkiFloat 5s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(240,180,41,.35));}
  @keyframes matkiFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  .matki-glow{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:210%;height:210%;
    background:radial-gradient(circle, rgba(240,180,41,.34) 0%, rgba(240,180,41,.10) 45%, transparent 72%);
    filter:blur(4px);z-index:0;pointer-events:none;}

  .bansuri-wrap{position:absolute;top:2px;right:2%;width:min(210px,40vw);opacity:0;transform:translate(30px,-14px) rotate(28deg);
    animation:bansuriIn 1.1s .35s cubic-bezier(.2,.85,.3,1.1) forwards;pointer-events:none;z-index:1;}
  @keyframes bansuriIn{to{opacity:.88;transform:translate(0,0) rotate(18deg);}}

  .role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:38px;max-width:640px;margin-left:auto;margin-right:auto;}
  .role-card{
    position:relative;border-radius:22px;padding:34px 22px 28px;text-align:center;text-decoration:none;color:var(--cream);
    background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1.5px solid rgba(255,255,255,0.10);transition:transform .18s ease, border-color .18s ease, background .18s ease;
    overflow:hidden;
  }
  .role-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .2s ease;
    background:radial-gradient(circle at 50% 0%, rgba(240,180,41,.20), transparent 60%);}
  .role-card:hover{transform:translateY(-5px);border-color:var(--gold-soft);}
  .role-card:hover::before{opacity:1;}
  .role-card.contestant:hover{border-color:var(--rose);}
  .role-icon{font-size:38px;margin-bottom:12px;}
  .role-title{font-family:'Cinzel',serif;font-weight:700;font-size:21px;letter-spacing:.03em;color:var(--gold-soft);position:relative;}
  .role-card.contestant .role-title{color:#f0a8c4;}
  .role-sub{font-size:13px;opacity:.72;margin-top:8px;line-height:1.55;position:relative;}

  .choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:18px;}
  .team-card{
    position:relative;border-radius:18px;padding:22px 16px 20px;text-align:center;
    background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);
    text-decoration:none;color:var(--cream);cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .team-card:hover{transform:translateY(-4px);border-color:var(--gold-soft);background:rgba(255,255,255,0.07);}
  .team-card.selected{border-color:var(--gold);background:rgba(240,180,41,0.14);box-shadow:0 0 0 2px rgba(240,180,41,.4) inset;}
  .team-card .dot{width:14px;height:14px;border-radius:50%;margin:0 auto 12px;}
  .team-card .lbl{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;}
  .team-card .sm{font-size:12px;opacity:.65;margin-top:4px;font-family:'JetBrains Mono',monospace;}

  .notice{
    margin-top:22px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);text-align:center;font-size:14px;opacity:.85;
  }
  .hint-line{max-width:520px;margin:10px auto 0;text-align:center;font-size:12.5px;opacity:.6;font-family:'JetBrains Mono',monospace;}
  .code-input{
    display:block;width:min(220px,100%);margin-top:8px;font-family:'JetBrains Mono',monospace;
    font-size:26px;letter-spacing:.35em;text-align:center;padding:12px 10px;border-radius:12px;
    background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.18);color:var(--gold-soft);
  }
  .code-input:focus{outline:2px solid var(--gold-soft);}
  .name-input{
    display:block;width:100%;max-width:340px;margin-top:8px;font-family:'Mukta',sans-serif;font-size:15px;
    padding:11px 14px;border-radius:12px;background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.18);color:var(--cream);
  }
  .name-input:focus{outline:2px solid var(--gold-soft);}
  .form-error{margin-top:12px;color:#ff9aa6;font-size:13px;font-family:'JetBrains Mono',monospace;}

  .pending-spinner{width:64px;height:64px;margin:34px auto 0;border-radius:50%;
    border:3px solid rgba(255,255,255,.12);border-top-color:var(--gold);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .room-code-box{margin-top:16px;text-align:center;}
  .room-code-label{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;opacity:.7;}
  .room-code-display{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:700;letter-spacing:.3em;
    color:var(--gold);margin:6px 0;text-shadow:0 0 16px rgba(240,180,41,.5);}

  .request-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);margin-bottom:8px;flex-wrap:wrap;}
  .request-row .who{flex:1;min-width:140px;}
  .request-row .who .n{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;}
  .request-row .who .t{font-size:11.5px;opacity:.65;font-family:'JetBrains Mono',monospace;}
  .empty-hint{opacity:.5;font-size:13px;padding:6px 2px;}

  .btn-sm{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12.5px;color:#fff;border:none;
    border-radius:8px;padding:7px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .btn-sm.green{background:linear-gradient(135deg,var(--success),#2f9c6f);}
  .btn-sm.red{background:linear-gradient(135deg,var(--danger),#a83346);}
  .btn-sm.ghost{background:rgba(255,255,255,0.09);box-shadow:none;border:1px solid rgba(255,255,255,0.18);}

  .team-page{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;}
  .status-pill{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.06em;
    padding:8px 16px;border-radius:999px;background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);margin-top:6px;text-align:center;
  }
  .playing-as{font-size:12px;opacity:.6;margin-top:4px;font-family:'JetBrains Mono',monospace;}
  .q-box{
    width:100%;max-width:520px;margin:22px auto 6px;padding:20px 22px;border-radius:16px;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);text-align:center;min-height:70px;
  }
  .q-box .qnum{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gold-soft);letter-spacing:.08em;}
  .q-box .qtext{font-size:19px;margin-top:8px;line-height:1.4;font-weight:600;}
  .q-box.waiting .qtext{opacity:.45;font-weight:400;}

  .buzz-btn{
    width:min(300px,72vw);height:min(300px,72vw);border-radius:50%;border:none;cursor:pointer;
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32px;color:#fff;
    margin:34px auto 10px;display:block;
    box-shadow:0 10px 0 rgba(0,0,0,.28), 0 18px 34px rgba(0,0,0,.35);
    transition:transform .08s ease, box-shadow .08s ease;
    letter-spacing:.02em;
  }
  .buzz-btn:active{transform:translateY(8px);box-shadow:0 2px 0 rgba(0,0,0,.28), 0 6px 14px rgba(0,0,0,.3);}
  .buzz-btn:disabled{filter:grayscale(.6) brightness(.6);cursor:not-allowed;box-shadow:0 6px 0 rgba(0,0,0,.2);}
  .buzz-feedback{text-align:center;font-family:'JetBrains Mono',monospace;font-size:13.5px;min-height:20px;margin-top:6px;}
  .team-mini-name{font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:800;text-align:center;margin-top:8px;}

  .race-board{
    display:grid;gap:8px;
    background:rgba(0,0,0,0.18);border-radius:20px;padding:18px 10px 8px;
    border:1px solid rgba(255,255,255,0.07);margin-top:18px;
  }
  .pole-col{display:flex;flex-direction:column;align-items:center;}
  .pole-col svg{width:100%;max-width:150px;height:auto;}
  .pole-name{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;text-align:center;margin-top:2px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;
  }
  .pole-steps{font-family:'JetBrains Mono',monospace;font-size:12px;opacity:.7;margin-top:1px;}

  .panel{
    background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);
    border-radius:16px;padding:18px 20px;margin-top:18px;position:relative;z-index:2;
  }
  .panel h3{font-size:15px;color:var(--gold-soft);letter-spacing:.03em;margin-bottom:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;color:#fff;
    border:none;border-radius:11px;padding:11px 18px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#d99a1f);color:#2a1c00;}
  .btn.green{background:linear-gradient(135deg,var(--success),#2f9c6f);}
  .btn.red{background:linear-gradient(135deg,var(--danger),#a83346);}
  .btn.sky{background:linear-gradient(135deg,var(--sky),#3f6fd6);}
  .btn.ghost{background:rgba(255,255,255,0.08);box-shadow:none;border:1px solid rgba(255,255,255,0.16);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}

  .buzz-banner{
    text-align:center;padding:14px;border-radius:14px;font-family:'Baloo 2',sans-serif;
    font-weight:800;font-size:20px;margin-top:14px;border:1.5px solid transparent;position:relative;z-index:2;
  }
  .buzz-banner.empty{background:rgba(255,255,255,0.04);color:rgba(248,241,222,0.5);font-weight:600;font-size:15px;}
  .buzz-banner.hit{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(.92);}60%{transform:scale(1.03);}100%{transform:scale(1);}}

  .queue-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .queue-chip{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:6px 12px;border-radius:999px;
    border:1.5px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.05);
  }
  .queue-chip.current{border-color:var(--gold);background:rgba(240,180,41,0.18);color:var(--gold-soft);font-weight:700;}
  .queue-chip.done-wrong{opacity:.5;text-decoration:line-through;}

  .check-result{margin-top:10px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;text-align:center;}
  .check-result.correct{color:var(--success);}
  .check-result.wrong{color:var(--danger);}

  .team-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .team-edit-row .swatch{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
  .team-edit-row input{
    flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
    border-radius:8px;padding:8px 10px;color:var(--cream);font-family:'Mukta',sans-serif;font-size:14px;
  }
  .team-edit-row input:focus{outline:2px solid var(--gold-soft);}

  /* ---------- Timer ---------- */
  .timer-big{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:16px auto 4px;font-family:'JetBrains Mono',monospace;}
  .timer-big .timer-num{font-size:56px;font-weight:800;color:var(--gold);text-shadow:0 0 18px rgba(240,180,41,.4);min-width:1.4em;text-align:center;}
  .timer-big .timer-lbl{font-size:13px;opacity:.6;letter-spacing:.08em;text-transform:uppercase;}
  .timer-big.urgent .timer-num{color:var(--danger);animation:timerPulse .6s ease-in-out infinite;}
  .timer-big.expired .timer-num{color:var(--danger);}
  .timer-big.paused .timer-num{color:var(--sky);}
  .timer-big.paused .timer-lbl::after{content:' (paused)';}
  @keyframes timerPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
  .display-wrap .timer-big .timer-num{font-size:clamp(70px,11vw,150px);}
  .display-wrap .timer-big .timer-lbl{font-size:16px;}

  /* ---------- Win sequence overlay ---------- */
  .winfx-el{position:fixed;z-index:80;}
  .win-splash{
    left:50%;top:20%;width:60px;height:60px;border-radius:50%;
    background:radial-gradient(circle, #fffdf3 0%, #f7d685 45%, #f0b429 85%, #d99a1f 100%);
    transform:translate(-50%,-50%) scale(0);
    animation:splashGrow 900ms cubic-bezier(.22,.85,.35,1) forwards;
  }
  @keyframes splashGrow{ to { transform:translate(-50%,-50%) scale(60);} }
  .win-flash{inset:0;background:#fffef8;opacity:0;animation:flashPulse 550ms ease-out forwards;}
  @keyframes flashPulse{0%{opacity:0;}35%{opacity:1;}100%{opacity:0;}}
  .win-reveal{
    inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;animation:revealIn 550ms cubic-bezier(.2,.8,.3,1.2) forwards;text-align:center;padding:20px;
  }
  @keyframes revealIn{from{opacity:0;transform:scale(.35);}to{opacity:1;transform:scale(1);}}
  .win-reveal svg{width:min(220px,42vw);height:auto;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));}
  .win-reveal h2{font-size:clamp(28px,6vw,52px);color:var(--terracotta-dark);text-shadow:0 2px 0 rgba(255,255,255,.4);margin-top:10px;}
  .win-reveal p{color:#5a3a12;opacity:.85;margin-top:6px;font-size:16px;}

/* ============================= AUDIO ============================= */
let actx = null;
function getCtx(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(ctx, freq, start, dur, type='sine', peak=0.22){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime+start);
  gain.gain.exponentialRampToValueAtTime(peak, ctx.currentTime+start+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(ctx.currentTime+start);
  osc.stop(ctx.currentTime+start+dur+0.05);
}
function playBuzzClick(){
  const ctx = getCtx(); if(!ctx) return;
  tone(ctx, 720, 0, 0.09, 'square', 0.16);
  tone(ctx, 480, 0.06, 0.08, 'square', 0.12);
}
function playBell(){
  const ctx = getCtx(); if(!ctx) return;
  const base = 880;
  [1, 1.5, 2.01, 2.66].forEach((mult,i)=>{
    tone(ctx, base*mult, 0, 1.1 - i*0.12, 'sine', 0.16 - i*0.03);
  });
  tone(ctx, base*0.5, 0, 1.3, 'triangle', 0.1);
}
function playReveal(){
  const ctx = getCtx(); if(!ctx) return;
  tone(ctx, 523.25, 0, 0.16, 'sine', 0.14);
  tone(ctx, 659.25, 0.12, 0.2, 'sine', 0.14);
}
function playChime(){
  const ctx = getCtx(); if(!ctx) return;
  tone(ctx, 660, 0, 0.14, 'triangle', 0.16);
  tone(ctx, 990, 0.1, 0.22, 'triangle', 0.14);
}
function playMatkaSmash(){
  const ctx = getCtx(); if(!ctx) return;
  tone(ctx, 90, 0, 0.35, 'sine', 0.3);
  tone(ctx, 60, 0.02, 0.4, 'sine', 0.24);
  const bufSize = ctx.sampleRate * 0.5;
  const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufSize, 2.2); }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(1800, ctx.currentTime);
  bp.frequency.exponentialRampToValueAtTime(400, ctx.currentTime+0.4);
  bp.Q.value = 0.8;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.5, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.48);
  noise.connect(bp).connect(g).connect(ctx.destination);
  noise.start();
}
function playFanfare(){
  const ctx = getCtx(); if(!ctx) return;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((f,i)=> tone(ctx, f, i*0.16, 0.42, 'triangle', 0.2));

}

const memoryStore = {};

function firebaseUrl(){
  return FIREBASE_CONFIG.databaseURL.replace(/\/$/,'') + '/' + STATE_KEY.replace(/:/g,'_') + '.json';
}
function firebaseReadUrl(){
  return firebaseUrl() + '?_=' + Date.now();
}

let lastStorageError = null;

async function loadState(){
  try{
    if(FIREBASE_OK){
      const res = await fetch(firebaseReadUrl(), { cache: 'no-store' });
      if(!res.ok){
        let detail = '';
        try{ detail = await res.text(); }catch(e){}
        lastStorageError = `Firebase read failed (${res.status} ${res.statusText}). ${detail}`;
        console.error(lastStorageError);
        return defaultState();
      }
      lastStorageError = null;
      const data = await res.json();
      return normalizeState(data);
    } else if(LOCALSTORAGE_OK){
      const raw = localStorage.getItem(STATE_KEY);
      if(!raw) return defaultState();
      return normalizeState(JSON.parse(raw));
    } else {
      if(!memoryStore[STATE_KEY]) return defaultState();
      return normalizeState(JSON.parse(memoryStore[STATE_KEY]));
    }
  }catch(e){
    lastStorageError = `Network/parse error reading state: ${e.message}`;
    console.error(lastStorageError);
    return defaultState();
  }
}
async function saveState(state){
  state.updatedAt = Date.now();
  try{
    if(FIREBASE_OK){
      const res = await fetch(firebaseUrl(), {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        cache: 'no-store',
        body: JSON.stringify(state)
      });
      if(!res.ok){
        let detail = '';
        try{ detail = await res.text(); }catch(e){}
        lastStorageError = `Firebase write failed (${res.status} ${res.statusText}). ${detail}`;
        console.error(lastStorageError);
        return { ...state, __saveFailed: true };
      }
      lastStorageError = null;
    } else if(LOCALSTORAGE_OK){
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    } else {
      memoryStore[STATE_KEY] = JSON.stringify(state);
    }
  }catch(e){
    lastStorageError = `Network error saving state: ${e.message}`;
    console.error(lastStorageError);
    return { ...state, __saveFailed: true };
  }
  return state;
}

/* ============================= LIVE TIMER TICKER ============================= */
/* One global fast interval keeps every .timer-big element on screen updated
   smoothly, reading whatever state each page's own poll loop last cached —
   this decouples the timer's smoothness from the (slower) network poll rate. */
let liveStateCache = null;
function formatTimeVal(sec){
  sec = Math.max(0, Math.ceil(sec));
  if(sec >= 60){
    const m = Math.floor(sec/60), s = sec%60;
    return m + ':' + String(s).padStart(2,'0');
  }
  return String(sec);
}
function updateTimerEl(el, state){
  if(!el || !state) return;
  const numEl = el.querySelector('.timer-num');
  if(!numEl) return;
  if(state.qIndex < 0 || !state.revealed || state.locked || !state.questionEndsAt){
    numEl.textContent = '--';
    el.classList.remove('urgent','expired','paused');
    return;
  }
  if(state.timerPaused){
    const remainPaused = Math.max(0, (state.timeRemainingMs||0)/1000);
    numEl.textContent = formatTimeVal(remainPaused);
    el.classList.remove('urgent','expired');
    el.classList.add('paused');
    return;
  }
  const remain = (state.questionEndsAt - Date.now())/1000;
  const expired = remain <= 0;
  numEl.textContent = expired ? '0' : formatTimeVal(remain);
  el.classList.toggle('urgent', !expired && remain <= 10);
  el.classList.toggle('expired', expired);
  el.classList.remove('paused');
}
setInterval(()=>{
  if(!liveStateCache) return;
  document.querySelectorAll('.timer-big').forEach(el=>updateTimerEl(el, liveStateCache));
}, 250);
function timerHtml(id, label){
  return `<div class="timer-big" id="${id}"><span class="timer-num">--</span><span class="timer-lbl">${label||'sec left'}</span></div>`;
}

function renderRaceBoard(state, containerId){
  const el = document.getElementById(containerId);
  if(!el) return;
  const teams = raceTeams(state);
  if(teams.length===0){
    el.style.gridTemplateColumns = '1fr';
    el.innerHTML = `<div class="empty-hint" style="text-align:center;padding:14px;">No approved teams yet.</div>`;
    return;
  }
  el.style.gridTemplateColumns = `repeat(${teams.length}, 1fr)`;
  el.innerHTML = teams.map(t=>{
    const steps = state.steps[t.id]||0;
    const rankIdx = (state.winners||[]).indexOf(t.id);
    const isWinner = rankIdx !== -1;
    const medal = isWinner ? rankMedal(rankIdx+1) : '';
    return `<div class="pole-col">
      ${poleSvg(t, steps, state.totalSteps, isWinner)}
      <div class="pole-name" style="color:${t.color}">${escapeHtml(t.name)}</div>
      <div class="pole-steps">${steps} / ${state.totalSteps}${isWinner?' '+medal:''}</div>
    </div>`;
  }).join('');
}

function renderKbcOptions(containerEl, q, {selected=null, revealed=false, interactive=false, suspense=false, onSelect=null} = {}){
  if(!containerEl) return;
  if(!q){ containerEl.innerHTML = ''; return; }
  containerEl.innerHTML = `
    <div class="kbc-qwrap ${suspense?'kbc-suspense':''}">
      <div class="kbc-qinner">
        <div class="kbc-qtext">${escapeHtml(q.q)}</div>
        <div class="kbc-option-grid" id="kbcOptGrid"></div>
      </div>
    </div>`;
  const grid = containerEl.querySelector('#kbcOptGrid');
  grid.innerHTML = q.options.map((opt,i)=>{
    let cls = 'kbc-option';
    if(revealed){
      if(i===q.correct) cls += ' correct';
      else if(i===selected) cls += ' wrong';
      else cls += ' dim';
    } else if(selected===i){
      cls += ' selected';
    }
    if(!interactive) cls += ' noclick';
    return `<button type="button" class="${cls}" data-idx="${i}" ${interactive?'':'disabled'}>
      <span class="opt-letter">${String.fromCharCode(65+i)}</span>
      <span class="opt-text">${escapeHtml(opt)}</span>
    </button>`;
  }).join('');
  if(interactive && onSelect){
    grid.querySelectorAll('.kbc-option').forEach(b=>{
      b.addEventListener('click', ()=> onSelect(parseInt(b.dataset.idx,10)));
    });
  }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function confettiBurst(){
  const colors=['#f0b429','#c1447e','#49b788','#5a8dee','#e8734a','#f7d685'];
  for(let i=0;i<70;i++){
    const el = document.createElement('div');
    el.className='confetti-piece winfx-el';
    const size = 6+Math.random()*7;
    el.style.width = size+'px';
    el.style.height = (size*0.4)+'px';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.left = Math.random()*100+'vw';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    const fall = el.animate([
      {transform:`translateY(0) rotate(0deg)`, opacity:1},
      {transform:`translateY(${90+Math.random()*10}vh) rotate(${360+Math.random()*360}deg)`, opacity:0.9}
    ],{duration:2200+Math.random()*1400, easing:'cubic-bezier(.2,.6,.4,1)'});
    fall.onfinish = ()=> el.remove();
  }
}

/* ============================= WIN SEQUENCE ============================= */
let lastWinnersShownCount = 0;
function rankMedal(rank){ return rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'🏅'; }
function rankWord(rank){ return rank===1?'1st':rank===2?'2nd':rank===3?'3rd':(rank+'th'); }
function triggerRankWinSequence(state, teamId, rank, playSound){
  clearWinFx();
  const team = findTeamById(state, teamId);
  const name = team ? team.name : teamId;
  const color = team ? team.color : '#f0b429';
  const medal = rankMedal(rank);
  const headline = rank===1 ? `${name} wins!` : `${name} finishes ${rankWord(rank)}!`;

  if(playSound) playMatkaSmash();

  const splash = document.createElement('div');
  splash.className = 'winfx-el win-splash';
  document.body.appendChild(splash);

  setTimeout(()=>{
    const flash = document.createElement('div');
    flash.className = 'winfx-el win-flash';
    document.body.appendChild(flash);
    setTimeout(()=>flash.remove(), 600);
  }, 650);

  setTimeout(()=>{
    if(playSound) playFanfare();
    const reveal = document.createElement('div');
    reveal.className = 'winfx-el win-reveal';
    reveal.innerHTML = `
      ${winnerFigureSvg(color)}
      <h2>${medal} ${escapeHtml(headline)}</h2>
      <p>${rank===1 ? 'The makhan-filled matka is broken — Jai Shri Krishna! 🧈🪈🦚' : 'Podium spot secured — the race continues!'}</p>
      <button class="btn gold" id="winCloseBtn">Close</button>
    `;
    document.body.appendChild(reveal);
    document.getElementById('winCloseBtn').addEventListener('click', clearWinFx);
    confettiBurst();
    if(rank===1) setTimeout(confettiBurst, 900);
  }, 900);
}

function maybeShowWin(state, playSound){
  const winners = state.winners || [];
  while(lastWinnersShownCount < winners.length){
    lastWinnersShownCount += 1;
    triggerRankWinSequence(state, winners[lastWinnersShownCount-1], lastWinnersShownCount, playSound);
  }
  if(winners.length === 0 && lastWinnersShownCount > 0){
    lastWinnersShownCount = 0;
    clearWinFx();
  }
}

async function contestantGameTick(team, state, displayName){
  document.getElementById('teamName').textContent = team.name;
  document.getElementById('playingAs').textContent = `Playing as ${displayName}`;
  const btn = document.getElementById('buzzBtn');
  const pill = document.getElementById('statusPill');
  const qBox = document.getElementById('qBox');
  const qtext = document.getElementById('qtext');
  const qnum = document.getElementById('qnum');
  const feedback = document.getElementById('feedback');
  const optionsWrap = document.getElementById('optionsWrap');

  renderRaceBoard(state, 'miniBoard');
  maybeShowWin(state, false);
  updateTimerEl(document.getElementById('timerDisplay'), state);

  if(!raceTeams(state).some(t=>t.id===team.id)){
    pill.textContent = 'This team is not part of the current round';
    btn.disabled = true; btn.textContent = 'WAIT';
    return;
  }

  if(state.locked){
    pill.textContent = '🏆 Game over';
    qBox.classList.add('waiting');
    const podiumText = (state.winners||[]).map((id,i)=>{
      const t = findTeamById(state, id);
      return `${rankMedal(i+1)} ${t?t.name:id}`;
    }).join('   ·   ');
    qtext.textContent = podiumText || 'The matka has been broken!';
    btn.disabled = true; btn.textContent = 'FINISHED';
    if(optionsWrap) optionsWrap.innerHTML = '';
    return;
  }

  const myRank = (state.winners||[]).indexOf(team.id);
  if(myRank !== -1){
    pill.textContent = `${rankMedal(myRank+1)} You finished ${rankWord(myRank+1)}! Waiting for the race to conclude…`;
    qBox.classList.add('waiting');
    qtext.textContent = 'Sit back and watch the remaining podium spots get decided.';
    btn.disabled = true; btn.textContent = 'FINISHED';
    if(optionsWrap) optionsWrap.innerHTML = '';
    return;
  }

  if(state.qIndex < 0 || !state.revealed){
    pill.textContent = 'Waiting for host…';
    qBox.classList.add('waiting');
    qnum.textContent = 'QUESTION';
    qtext.textContent = 'Get ready — the host will show the next question here.';
    btn.disabled = true; btn.textContent = 'WAIT';
    feedback.textContent = '';
    if(optionsWrap) optionsWrap.innerHTML = '';
    return;
  }

  const q = QUESTIONS[state.qIndex % QUESTIONS.length];
  qBox.classList.remove('waiting');
  qnum.textContent = `QUESTION ${(state.qIndex % QUESTIONS.length) + 1}`;
  qtext.textContent = q.q;

  const expired = isTimeExpired(state);
  const cur = currentAnswererId(state);
  const iAmOut = state.wrongTeams.includes(team.id);
  const iAmQueued = state.buzzQueue.some(b=>b.teamId===team.id);
  const iAmCurrent = cur === team.id;

  if(expired){
    pill.textContent = "⏱ Time's up for this question";
    btn.disabled = true; btn.textContent = 'TIME UP';
    feedback.textContent = '';
    renderKbcOptions(optionsWrap, q, {selected: state.selectedAnswer, revealed: state.revealedAnswer, interactive:false});
  } else if(iAmCurrent){
    const canPick = state.selectedAnswer===null;
    pill.textContent = canPick ? '🎙️ Your turn! Tap your answer.' : (state.revealedAnswer ? 'Answer revealed' : 'Answer locked in — waiting for host');
    btn.disabled = true; btn.textContent = 'YOUR TURN';
    feedback.textContent = canPick ? 'Choose one option below.' : '';
    renderKbcOptions(optionsWrap, q, {
      selected: state.selectedAnswer, revealed: state.revealedAnswer, interactive: canPick,
      onSelect: (idx)=> doSelectAnswer(team, idx)
    });
  } else if(iAmQueued){
    pill.textContent = '🔔 You buzzed — waiting for your turn';
    btn.disabled = true; btn.textContent = 'QUEUED';
    feedback.textContent = '';
    renderKbcOptions(optionsWrap, q, {selected: state.selectedAnswer, revealed: state.revealedAnswer, interactive:false});
  } else if(iAmOut){
    pill.textContent = 'You already answered this one — waiting for next question';
    btn.disabled = true; btn.textContent = 'WAIT';
    feedback.textContent = '';
    renderKbcOptions(optionsWrap, q, {selected: state.selectedAnswer, revealed: state.revealedAnswer, interactive:false});
  } else if(state.buzzQueue.length < 2){
    pill.textContent = 'Buzzer is live!';
    btn.disabled = false; btn.textContent = 'BUZZ';
    feedback.textContent = '';
    renderKbcOptions(optionsWrap, q, {interactive:false});
  } else {
    pill.textContent = 'Two teams already buzzed — you missed this round';
    btn.disabled = true; btn.textContent = 'MISSED';
    feedback.textContent = '';
    renderKbcOptions(optionsWrap, q, {selected: state.selectedAnswer, revealed: state.revealedAnswer, interactive:false});
  }
}

async function doSelectAnswer(team, idx){
  playBuzzClick();
  const state = await loadState();
  if(state.locked || isTimeExpired(state) || currentAnswererId(state) !== team.id || state.selectedAnswer !== null) return;
  state.selectedAnswer = idx;
  if(!state.timerPaused && state.questionEndsAt){
    state.timerPaused = true;
    state.timeRemainingMs = Math.max(0, state.questionEndsAt - Date.now());
  }
  await saveState(state);
}

async function doBuzz(team){
  playBuzzClick();
  const state = await loadState();
  if(state.locked || state.qIndex<0 || !state.revealed || isTimeExpired(state)) return;
  if((state.winners||[]).includes(team.id)) return;
  if(state.buzzQueue.length >= 2) return;
  if(state.buzzQueue.some(b=>b.teamId===team.id)) return;
  if(state.wrongTeams.includes(team.id)) return;
  state.buzzQueue.push({teamId: team.id, ts: Date.now()});
  const result = await saveState(state);
  if(result.__saveFailed){
    const feedback = document.getElementById('feedback');
    if(feedback) feedback.textContent = "⚠️ Couldn't reach the game server — ask the host to check the Firebase database rules.";
  }
}

async function doRoomBuzz(team){
  playBuzzClick();
  const state = await loadState();
  const r = state.room;
  if(!r.configured || !r.questionOpen) return;
  if(r.buzzQueue.some(b=>b.teamId===team.id)) return;
  if(r.wrongTeams.includes(team.id)) return;
  r.buzzQueue.push({teamId: team.id, ts: Date.now()});
  const result = await saveState(state);
  if(result.__saveFailed){
    const feedback = document.getElementById('roomFeedback');
    if(feedback) feedback.textContent = "⚠️ Couldn't reach the game server — ask the host to check the Firebase database rules.";
  }
}

function stopContestantPolling(){
  if(contestantPollHandle){ clearInterval(contestantPollHandle); contestantPollHandle = null; }
}

function startContestantPolling(){
  stopContestantPolling();
  const loop = async ()=>{
    const state = await loadState();
    liveStateCache = state;
    if(!myRequestId) return;
    const req = state.joinRequests.find(r=>r.id===myRequestId);
    if(!req){
      stopContestantPolling(); myRequestId = null;
      contestantPhase = 'missing'; renderContestantBlocked('missing');
      return;
    }
    if(req.status === 'pending'){
      if(contestantPhase !== 'pending'){ contestantPhase = 'pending'; renderContestantPending(); }
      return;
    }
    if(req.status === 'denied'){
      stopContestantPolling(); myRequestId = null;
      contestantPhase = 'denied'; renderContestantBlocked('denied');
      return;
    }
    if(req.status === 'revoked'){
      stopContestantPolling(); myRequestId = null;
      contestantPhase = 'revoked'; renderContestantBlocked('revoked');
      return;
    }
    if(req.status === 'approved'){
      const team = findTeamById(state, req.teamId);
      if(!team) return;
      if(contestantPhase !== 'game'){ contestantPhase = 'game'; renderContestantGameShell(team); }
      await contestantGameTick(team, state, req.name);
      return;
    }
  };
  loop();
  contestantPollHandle = setInterval(loop, POLL_MS);
}

let roomLastEventTs = 0;
async function roomGameTick(team, state, displayName){
  const r = state.room;
  document.getElementById('roomTeamName').textContent = team.name;
  document.getElementById('roomPlayingAs').textContent = `Playing as ${displayName}`;
  const pill = document.getElementById('roomStatusPill');
  const qBox = document.getElementById('roomQBox');
  const qRound = document.getElementById('roomQRound');
  const qText = document.getElementById('roomQText');
  const btn = document.getElementById('roomBuzzBtn');
  const feedback = document.getElementById('roomFeedback');
  const pointsBadge = document.getElementById('roomPointsBadge');
  const scoreStrip = document.getElementById('roomScoreStrip');
  const leaderboardWrap = document.getElementById('roomLeaderboardWrap');

  const myScore = r.scores[team.id]||0;
  scoreStrip.innerHTML = `<div class="score-chip" style="border-color:${team.color};color:${team.color}">Your total: ${myScore} pts</div>`;

  if(r.lastEvent && r.lastEvent.teamId===team.id && r.lastEvent.ts !== roomLastEventTs && (Date.now()-r.lastEvent.ts) < 9000){
    roomLastEventTs = r.lastEvent.ts;
  }
  if(r.lastEvent && r.lastEvent.teamId===team.id && (Date.now()-r.lastEvent.ts) < 6000){
    feedback.className = 'room-feedback ' + (r.lastEvent.correct?'good':'bad');
    feedback.textContent = r.lastEvent.correct ? `✅ Correct! +${r.lastEvent.points} points` : `❌ Wrong answer`;
  } else {
    feedback.className = 'room-feedback';
    feedback.textContent = '';
  }

  if(r.finished){
    pill.textContent = '🏁 Buzzer room complete';
    qBox.classList.add('waiting');
    qRound.textContent = 'FINISHED';
    qText.textContent = r.leaderboard ? 'Final standings are in!' : 'Waiting for the host to reveal final standings…';
    btn.disabled = true; btn.textContent = 'DONE';
    pointsBadge.textContent = '--';
    renderRoomLeaderboard(leaderboardWrap, r.leaderboard);
    return;
  }
  leaderboardWrap.innerHTML = '';

  const round = roomCurrentRound(state);
  if(!round || r.qIndex < 0){
    pill.textContent = 'Waiting for host to start…';
    qBox.classList.add('waiting');
    qRound.textContent = 'ROUND';
    qText.textContent = 'Get ready — the host will start the first question shortly.';
    btn.disabled = true; btn.textContent = 'WAIT';
    pointsBadge.textContent = '-- pts on this question';
    return;
  }

  qBox.classList.remove('waiting');
  qRound.textContent = `${round.name.toUpperCase()} — Q.${r.qIndex+1} OF ${round.numQuestions}`;
  qText.textContent = `Q.${r.qIndex+1}`;
  pointsBadge.textContent = `${r.currentPoints} pts on this question`;

  const cur = roomCurrentAnswererId(state);
  const iAmOut = r.wrongTeams.includes(team.id);
  const iAmQueued = r.buzzQueue.some(b=>b.teamId===team.id);
  const iAmCurrent = cur === team.id;

  if(!r.questionOpen){
    pill.textContent = r.answeredCorrect ? '✔ Question answered — wait for the next one' : 'Waiting for host…';
    btn.disabled = true; btn.textContent = 'WAIT';
  } else if(iAmCurrent){
    pill.textContent = '🎙️ Your turn! Answer out loud — waiting for host to judge.';
    btn.disabled = true; btn.textContent = 'YOUR TURN';
  } else if(iAmQueued){
    pill.textContent = '🔔 You buzzed — waiting in line';
    btn.disabled = true; btn.textContent = 'QUEUED';
  } else if(iAmOut){
    pill.textContent = 'You already tried this one — waiting for next question';
    btn.disabled = true; btn.textContent = 'WAIT';
  } else {
    pill.textContent = 'Buzzer is live!';
    btn.disabled = false; btn.textContent = 'BUZZ';
  }
}

function renderRequestLists(state){
  const pendingEl = document.getElementById('pendingList');
  const approvedEl = document.getElementById('approvedList');
  if(!pendingEl || !approvedEl) return;

  const pending = state.joinRequests.filter(r=>r.status==='pending');
  const approved = state.joinRequests.filter(r=>r.status==='approved');

  pendingEl.innerHTML = pending.length ? pending.map(r=>{
    const t = findTeamById(state, r.teamId);
    return `<div class="request-row">
      <div class="who"><div class="n">${escapeHtml(r.name)}</div><div class="t" style="color:${t?t.color:'#ccc'}">${escapeHtml(t?t.name:'Unknown team')}</div></div>
      <button class="btn-sm green" data-approve="${r.id}">Approve</button>
      <button class="btn-sm red" data-deny="${r.id}">Deny</button>
    </div>`;
  }).join('') : `<div class="empty-hint">No pending requests right now.</div>`;

  approvedEl.innerHTML = approved.length ? approved.map(r=>{
    const t = findTeamById(state, r.teamId);
    return `<div class="request-row">
      <div class="who"><div class="n">${escapeHtml(r.name)}</div><div class="t" style="color:${t?t.color:'#ccc'}">${escapeHtml(t?t.name:'Unknown team')}</div></div>
      <button class="btn-sm ghost" data-revoke="${r.id}">Revoke</button>
    </div>`;
  }).join('') : `<div class="empty-hint">No one has been approved yet.</div>`;

  pendingEl.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click', ()=>hostApproveRequest(b.dataset.approve)));
  pendingEl.querySelectorAll('[data-deny]').forEach(b=>b.addEventListener('click', ()=>hostDenyRequest(b.dataset.deny)));
  approvedEl.querySelectorAll('[data-revoke]').forEach(b=>b.addEventListener('click', ()=>hostRevokeRequest(b.dataset.revoke)));
}

async function hostMarkCorrect(){
  const state = await loadState();
  const cur = currentAnswererId(state);
  if(!cur || state.locked) return;
  if(state.winners.includes(cur)) return; // already finished, guard against re-award
  state.steps[cur] = Math.min((state.steps[cur]||0)+1, state.totalSteps);
  const justFinished = state.steps[cur] >= state.totalSteps;
  if(justFinished){
    state.winners.push(cur);
    if(state.winners.length >= (state.winnersNeeded||1)){
      state.winner = state.winners[0];
      state.locked = true;
    }
  }
  state.revealed = false;
  state.buzzQueue = [];
  state.currentTurn = 0;
  state.selectedAnswer = null;
  state.revealedAnswer = false;
  state.wrongTeams = [];
  state.questionEndsAt = null;
  state.timerPaused = false;
  state.timeRemainingMs = null;
  hostCheckOn = false;
  await saveState(state);
  if(justFinished){
    maybeShowWin(state, true);
  } else {
    playBell();
  }
}

  fresh.lobbyOpen = state.lobbyOpen;

/* ---------- Buzzer Room: host actions ---------- */
async function hostRoomCreate(rounds){
  const state = await loadState();
  state.room = defaultRoomState();
  state.room.configured = true;
  state.room.passkey = genRoomCode();
  state.room.rounds = rounds;
  await saveState(state);
  return state;
}
async function hostRoomNewPasskey(){
  const state = await loadState();
  state.room.passkey = genRoomCode();
  await saveState(state);
}
async function hostRoomNextQuestion(){
  getCtx();
  const state = await loadState();
  const r = state.room;
  if(!r.configured || r.finished) return;
  if(r.roundIndex < 0){
    r.roundIndex = 0; r.qIndex = 0;
  } else {
    const round = r.rounds[r.roundIndex];
    if(r.qIndex + 1 < round.numQuestions){
      r.qIndex += 1;
    } else if(r.roundIndex + 1 < r.rounds.length){
      r.roundIndex += 1; r.qIndex = 0;
    } else {
      r.finished = true; r.questionOpen = false;
      await saveState(state);
      return;
    }
  }
  const round = r.rounds[r.roundIndex];
  r.buzzQueue = []; r.currentTurn = 0; r.wrongTeams = [];
  r.answeredCorrect = false; r.currentPoints = round.points;
  r.questionOpen = true; r.lastEvent = null;
  await saveState(state);
  playReveal();
}
async function hostRoomMarkCorrect(){
  const state = await loadState();
  const r = state.room;
  if(!r.questionOpen || r.answeredCorrect) return; // already judged — ignore repeat clicks
  const cur = roomCurrentAnswererId(state);
  if(!cur) return;
  r.scores[cur] = (r.scores[cur]||0) + r.currentPoints;
  r.answeredCorrect = true;
  r.questionOpen = false;
  r.lastEvent = {teamId:cur, correct:true, points:r.currentPoints, ts:Date.now()};
  await saveState(state);
  playFanfare();
}
async function hostRoomMarkWrong(){
  const state = await loadState();
  const r = state.room;
  if(!r.questionOpen || r.answeredCorrect) return; // already judged — ignore repeat clicks
  const cur = roomCurrentAnswererId(state);
  if(!cur) return;
  r.wrongTeams.push(cur);
  r.lastEvent = {teamId:cur, correct:false, points:r.currentPoints, ts:Date.now()};
  r.currentTurn += 1;
  r.currentPoints = Math.max(1, r.currentPoints - 1);
  if(r.currentTurn >= r.buzzQueue.length){
    r.questionOpen = false;
  }
  await saveState(state);
  playBell();
}
async function hostRoomResetBuzz(){
  const state = await loadState();
  const r = state.room;
  if(r.roundIndex < 0 || !r.rounds[r.roundIndex]) return;
  r.buzzQueue = []; r.currentTurn = 0; r.wrongTeams = [];
  r.answeredCorrect = false; r.currentPoints = r.rounds[r.roundIndex].points;
  r.questionOpen = true; r.lastEvent = null;
  await saveState(state);
}
async function hostRoomFinalize(){
  const state = await loadState();
  const r = state.room;
  const entries = r.teams.map(t=>({teamId:t.id, name:t.name, color:t.color, score:r.scores[t.id]||0}));
  entries.sort((a,b)=>b.score-a.score);
  r.leaderboard = entries;
  await saveState(state);
  playFanfare();
}
async function hostRoomResetProgress(){
  if(!confirm('Reset the buzzer room progress? Round setup and teams are kept, scores go back to 0.')) return;
  const state = await loadState();
  const r = state.room;
  r.roundIndex = -1; r.qIndex = -1;
  r.buzzQueue = []; r.currentTurn = 0; r.wrongTeams = [];
  r.questionOpen = false; r.answeredCorrect = false; r.currentPoints = 0;
  r.lastEvent = null; r.finished = false; r.leaderboard = null;
  r.teams.forEach(t=>{ r.scores[t.id] = 0; });
  await saveState(state);
}
async function hostRoomNewSetup(){
  if(!confirm('Start a brand new buzzer room? This clears the current rounds, teams and scores.')) return;
  const state = await loadState();
  state.room = defaultRoomState();
  await saveState(state);
  return state;
}

function renderTeamEdit(state){

      await saveState(s);

  });
}

function renderRoomRoundFields(container, count, prevValues){
  let rows = '';
  for(let i=0;i<count;i++){
    const v = (prevValues && prevValues[i]) || {name:`Round ${i+1}`, numQuestions:10, points:5};
    rows += `

          <div>
            <label>Round name</label>

          </div>
          <div>
            <label>Questions</label>
            <input type="number" data-rc="numQuestions" data-idx="${i}" value="${v.numQuestions}" min="1" max="60">
          </div>
          <div>

            <input type="number" data-rc="points" data-idx="${i}" value="${v.points}" min="1" max="50">
          </div>
        </div>
      </div>`;
  }
  container.innerHTML = rows;
}

function readRoomRoundFields(container, count){
  const rounds = [];
  for(let i=0;i<count;i++){
    const name = container.querySelector(`input[data-rc="name"][data-idx="${i}"]`).value.trim() || `Round ${i+1}`;
    const numQuestions = Math.max(1, parseInt(container.querySelector(`input[data-rc="numQuestions"][data-idx="${i}"]`).value, 10) || 1);
    const points = Math.max(1, parseInt(container.querySelector(`input[data-rc="points"][data-idx="${i}"]`).value, 10) || 1);
    rounds.push({name, numQuestions, points});
  }
  return rounds;
}

async function hostRoomTick(state){
  const r = state.room;
  if(!r.configured){
    if(roomPanelMode !== 'setup') renderRoomSetupForm(null);
    return;
  }
  if(roomPanelMode !== 'dashboard'){ renderRoomDashboard(state); }

  const passkeyEl = document.getElementById('roomPasskeyVal');
  if(passkeyEl) passkeyEl.textContent = r.passkey || '----';

  const qBox = document.getElementById('roomQBoxHost');
  const qNum = document.getElementById('roomQNumHost');
  const qText = document.getElementById('roomQTextHost');
  const pointsBadge = document.getElementById('roomPointsBadgeHost');
  const buzzSeq = document.getElementById('roomBuzzSeq');
  const scoreboard = document.getElementById('roomScoreboard');
  const correctBtn = document.getElementById('roomCorrectBtn');
  const wrongBtn = document.getElementById('roomWrongBtn');
  const nextBtn = document.getElementById('roomNextBtn');
  const finishPanel = document.getElementById('roomFinishPanel');
  const leaderboardHost = document.getElementById('roomLeaderboardHost');
  if(!qBox) return;

  if(scoreboard){
    scoreboard.innerHTML = r.teams.length ? r.teams.map(t=>
      `<div class="score-chip" style="border-color:${t.color};color:${t.color}">${escapeHtml(t.name)}: ${r.scores[t.id]||0} pts</div>`
    ).join('') : `<div class="empty-hint">No contestants have joined the room yet.</div>`;
  }

  if(finishPanel) finishPanel.style.display = r.finished ? 'block' : 'none';
  if(r.finished && leaderboardHost){
    renderRoomLeaderboard(leaderboardHost, r.leaderboard);
  }
  if(nextBtn) nextBtn.disabled = r.finished;

  const round = roomCurrentRound(state);
  if(!round){
    qBox.classList.add('waiting');
    qNum.textContent = 'ROUND';
    qText.textContent = r.finished ? 'All rounds complete.' : 'Press "Next Question" to begin.';
    pointsBadge.textContent = '-- pts';
    buzzSeq.innerHTML = `<div class="empty-hint">No question live.</div>`;
    correctBtn.disabled = true; wrongBtn.disabled = true;
    return;
  }

  qBox.classList.remove('waiting');
  qNum.textContent = `${round.name.toUpperCase()} — Q.${r.qIndex+1} OF ${round.numQuestions}`;
  qText.textContent = `Q.${r.qIndex+1}`;
  pointsBadge.textContent = `${r.currentPoints} pts available now`;

  if(r.buzzQueue.length===0){
    buzzSeq.innerHTML = `<div class="empty-hint">${r.questionOpen ? 'No one has buzzed for this question yet.' : 'Buzzer closed.'}</div>`;
  } else {
    buzzSeq.innerHTML = r.buzzQueue.map((b,i)=>{
      const t = r.teams.find(tm=>tm.id===b.teamId);
      const name = t ? t.name : b.teamId;
      const isCur = i===r.currentTurn;
      const isDone = i<r.currentTurn;
      let cls = 'buzz-seq-row';
      if(isCur) cls += ' current';
      else if(isDone) cls += ' wrongdone';
      return `<div class="${cls}"><div class="ordnum">${i+1}</div><div class="ordname" style="color:${t?t.color:'#fff'}">${escapeHtml(name)}</div>${isCur?'<span style="font-family:\'JetBrains Mono\',monospace;font-size:11.5px;opacity:.75;">answering…</span>':isDone?'<span style="font-family:\'JetBrains Mono\',monospace;font-size:11.5px;opacity:.6;">wrong</span>':''}</div>`;
    }).join('');
  }

  const cur = roomCurrentAnswererId(state);
  const canJudge = !!cur && r.questionOpen && !r.answeredCorrect;
  correctBtn.disabled = !canJudge;
  wrongBtn.disabled = !canJudge;
}

async function hostTick(state){
  liveStateCache = state;
  renderRaceBoard(state, 'board');
  maybeShowWin(state, false);
  renderRequestLists(state);
  updateTimerEl(document.getElementById('timerDisplay'), state);

  const qBox = document.getElementById('qBox');
  const qnum = document.getElementById('qnum');
  const qtext = document.getElementById('qtext');
  const banner = document.getElementById('buzzBanner');
  const queueList = document.getElementById('queueList');
  const correctBtn = document.getElementById('correctBtn');
  const wrongBtn = document.getElementById('wrongBtn');
  const revealBtn = document.getElementById('revealBtn');
  const checkBtn = document.getElementById('checkBtn');
  const addTimeBtn = document.getElementById('addTimeBtn');
  const optionsWrap = document.getElementById('hostOptionsWrap');
  const checkResultWrap = document.getElementById('checkResultWrap');

  let q = null;
  if(state.qIndex < 0){
    qBox.classList.add('waiting');
    qnum.textContent = 'QUESTION';
    qtext.textContent = 'Press "Show Next Question" to begin.';
    optionsWrap.innerHTML = '';
  } else {
    q = QUESTIONS[state.qIndex % QUESTIONS.length];
    qBox.classList.remove('waiting');
    qnum.textContent = `QUESTION ${(state.qIndex % QUESTIONS.length)+1} of ${QUESTIONS.length}`;
    qtext.textContent = q.q;
    const peekRevealed = state.revealedAnswer || (hostCheckOn && state.selectedAnswer!==null);
    renderKbcOptions(optionsWrap, q, {selected: state.selectedAnswer, revealed: peekRevealed, interactive:false});
  }

  const cur = currentAnswererId(state);
  const expired = isTimeExpired(state);

  if(cur){
    const t = findTeamById(state, cur);
    const name = t ? t.name : cur;
    banner.className = 'buzz-banner hit';
    banner.style.background = (t?t.color:'#f0b429')+'26';
    banner.style.borderColor = t?t.color:'#f0b429';
    banner.style.color = t?t.color:'#f0b429';
    const pickText = state.selectedAnswer===null ? 'choosing an answer…' : `picked option ${String.fromCharCode(65+state.selectedAnswer)}`;
    banner.textContent = `🔔 ${name}'s turn — ${pickText}`;
    correctBtn.disabled = state.locked;
    wrongBtn.disabled = state.locked;
  } else {
    banner.className = 'buzz-banner empty';
    banner.style.background=''; banner.style.borderColor=''; banner.style.color='';
    banner.textContent = expired ? "⏱ Time's up — no one left to answer" : (state.revealed ? 'Waiting for a team to buzz…' : 'No question live');
    correctBtn.disabled = true;
    wrongBtn.disabled = true;
  }

  if(queueList){
    if(state.buzzQueue.length===0){
      queueList.innerHTML = '';
    } else {
      queueList.innerHTML = state.buzzQueue.map((b,i)=>{
        const t = findTeamById(state, b.teamId);
        const name = t ? t.name : b.teamId;
        const isCur = i===state.currentTurn;
        const isDone = i<state.currentTurn;
        let cls = 'queue-chip';
        if(isCur) cls += ' current';
        else if(isDone) cls += ' done-wrong';
        return `<div class="${cls}">${i+1}. ${escapeHtml(name)}${isCur?' (answering)':isDone?' (wrong)':''}</div>`;
      }).join('');
    }
  }

  if(checkResultWrap){
    if(hostCheckOn && cur && state.selectedAnswer!==null && q){
      const isCorrect = state.selectedAnswer === q.correct;
      checkResultWrap.innerHTML = `<div class="check-result ${isCorrect?'correct':'wrong'}">${isCorrect?'✓ Correct answer selected':'✗ Incorrect answer selected'} (host-only view)</div>`;
    } else {
      checkResultWrap.innerHTML = '';
    }
  }

  if(checkBtn) checkBtn.disabled = !(cur && state.selectedAnswer!==null);
  if(checkBtn) checkBtn.textContent = hostCheckOn ? '🙈 Hide Check' : '👁 Check Answer (host only)';
  if(revealBtn) revealBtn.disabled = state.locked || state.qIndex<0 || !state.revealed || state.revealedAnswer;
  if(addTimeBtn) addTimeBtn.disabled = state.locked || state.qIndex<0 || !state.revealed;
  document.getElementById('nextBtn').disabled = state.locked;
}

    document.getElementById('tabRoomBtn').addEventListener('click', ()=> setActiveTab('room'));

    if(!namesInit){ renderTeamEdit(state); namesInit = true; }
    else {
      const activeEl = document.activeElement;
      const isEditingName = activeEl && activeEl.tagName==='INPUT' && activeEl.dataset && activeEl.dataset.team;
      if(!isEditingName) renderTeamEdit(state);
    }
  };
  loop();
  setInterval(loop, POLL_MS);
}

/* ============================= DISPLAY (PROJECTOR) PAGE ============================= */
function renderDisplayShell(){
  app.innerHTML = `
    ${bannerHtml()}
    <div class="topbar">
      <div class="brand">${logoSvg()}<div class="brand-text"><div class="name">I&amp;E CELL</div><div class="tag">Dahi Handi Quiz Race — Projector</div></div></div>
      <a href="?" class="btn ghost" style="text-decoration:none;">← Home</a>
    </div>
    <div class="feather-divider"></div>
    <div class="wrap display-wrap" style="padding:0;">
      <div class="display-title" id="displayTitle">Waiting for the host to start…</div>
      ${timerHtml('timerDisplay')}
      <div class="display-kbc" id="displayKbc"></div>
      <div class="display-race">
        <div id="displayBoard" class="race-board"></div>
      </div>
    </div>
  `;
}

let displayLastQIndex = -2;
let displayLastRevealed = false;

async function displayTick(state){
  liveStateCache = state;
  const title = document.getElementById('displayTitle');
  const kbcWrap = document.getElementById('displayKbc');

  renderRaceBoard(state, 'displayBoard');
  maybeShowWin(state, true);
  updateTimerEl(document.getElementById('timerDisplay'), state);

  if(state.locked){
    const podiumText = (state.winners||[]).map((id,i)=>{
      const t = findTeamById(state, id);
      return `${rankMedal(i+1)} ${t?t.name:id}`;
    }).join('   ·   ');
    title.textContent = `🏆 ${podiumText || 'The matka has been broken!'}`;
    kbcWrap.innerHTML = '';
    displayLastQIndex = state.qIndex; displayLastRevealed = false;
    return;
  }

  if(state.qIndex < 0 || !state.revealed){
    title.textContent = 'Waiting for the host to start…';
    kbcWrap.innerHTML = `<div class="display-waiting">The next question will appear here.</div>`;
    displayLastQIndex = state.qIndex; displayLastRevealed = false;
    return;
  }

  const q = QUESTIONS[state.qIndex % QUESTIONS.length];

  if(state.qIndex !== displayLastQIndex){
    displayLastQIndex = state.qIndex;
    displayLastRevealed = false;
    playReveal();
  }
  if(state.revealedAnswer && !displayLastRevealed){
    displayLastRevealed = true;
    if(state.selectedAnswer===null) playChime();
    else if(state.selectedAnswer === q.correct) playFanfare(); else playBell();
  }
  if(!state.revealedAnswer) displayLastRevealed = false;

  const expired = isTimeExpired(state);
  title.textContent = expired ? `Question ${(state.qIndex % QUESTIONS.length)+1} — Time's up!` : `Question ${(state.qIndex % QUESTIONS.length)+1} of ${QUESTIONS.length}`;
  const cur = currentAnswererId(state);
  const suspense = !!cur && state.selectedAnswer===null && !state.revealedAnswer;
  renderKbcOptions(kbcWrap, q, {selected: state.selectedAnswer, revealed: state.revealedAnswer, interactive:false, suspense});

  if(cur){
    const t = findTeamById(state, cur);
    const name = t ? t.name : cur;
    const buzzNote = document.createElement('div');
    buzzNote.className = 'display-waiting';
    buzzNote.style.color = t?t.color:'var(--gold)';
    buzzNote.style.opacity = '0.9';
    buzzNote.textContent = `🔔 ${name}'s turn to answer`;
    kbcWrap.appendChild(buzzNote);
  }
}

function initDisplayPage(){
  renderDisplayShell();
  const loop = async ()=>{
    const state = await loadState();
    await displayTick(state);
  };
  loop();
  setInterval(loop, POLL_MS);
}

(async function init(){
  if(role === 'contestant'){
    initContestantPage();
  } else if(role === 'host'){
    renderHostPassword();
  } else if(role === 'display'){
    initDisplayPage();
  } else if(role){
    renderInvalid();
  } else {
    renderLanding();
  }
})();
